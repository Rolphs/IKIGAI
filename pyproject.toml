[project]
name = "ikigai-tulipan"
version = "3.1.0"
description = "Web app local-first para construir tu Ikigai personal: cuestionario, inventario taggeable, sintesis dialectica y visualizacion Venn de 4 circulos. Para autoconocimiento, mentoring y planeacion de carrera."
authors = [{ name = "Raúl Mercado", email = "raul.mercado.bustamante@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
ikigai = "ikigai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ikigai"]

# Nota: NO usar [tool.hatch.build.targets.wheel.shared-data] para templates/.
# Los templates ya viajan dentro del paquete (al estar en ikigai/templates/)
# y se localizan via Path(__file__).parent / "templates". La directiva
# shared-data los duplicaba en <sys.prefix>/data/, inflando el wheel ~150KB
# y dejando copias inutiles (nada las lee desde ahi).
#
# Si en el futuro hace falta servir assets desde fuera del paquete, el
# patron correcto es importlib.resources, NO shared-data.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]
ignore = ["E501"]  # line-length: formatter handles it

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False in tests is fine
# El modulo algebra y sus tests usan a proposito simbolos matematicos unicode
# (∪, ∩, ¬, ∆, ·, ⊕) que ruff marca como "ambiguous" con sus equivalentes
# ASCII. La ambiguedad es justamente el punto del modulo: ensenar la equivalencia.
"ikigai/algebra.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_algebra.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/", "build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
